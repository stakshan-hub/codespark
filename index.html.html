<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#e5e7ff,#d8fff2);color:#202747}.card{text-align:center;background:white;padding:32px;border-radius:22px;box-shadow:0 18px 55px #24335b22}.rocket{font-size:46px}button{border:0;border-radius:9px;padding:11px 18px;background:#6d55f5;color:white;cursor:pointer}#message{color:#66708a}</style></head><body><main class="card">
  <div class="rocket">🚀</div>
  <h1>Hello, CodeSpark!</h1>
  <p>Your next big idea starts here.</p>
  <button id="hello">Click me</button>
  <p id="message">Your website is running.</p>
</main><script>try{document.getElementById("hello").addEventListener("click",()=>{document.getElementById("message").textContent="You ran JavaScript successfully! 🎉";});}catch(e){parent.postMessage({type:"codespark-error",message:e.message},"*")}</script></body></html>
